<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#7c5cbf">
    <title>Settings - Afvalkalender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e8e0f0;
            --surface: #ffffff;
            --surface-alt: #f4f0fa;
            --card: #ffffff;
            --border: rgba(120, 100, 160, 0.12);
            --text: #2d2840;
            --text-secondary: #6e6590;
            --text-muted: #a89dc4;
            --purple: #7c5cbf;
            --purple-light: #a78bfa;
            --purple-bg: rgba(124, 92, 191, 0.08);
            --green: #22c55e;
            --green-bg: #e8faf0;
            --shadow-md: 0 4px 16px rgba(80, 60, 120, 0.08);
            --shadow-lg: 0 8px 32px rgba(80, 60, 120, 0.1);
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 20px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header-card {
            background: var(--purple);
            border-radius: var(--radius);
            padding: 24px 28px;
            color: #fff;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .header-card::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            background: rgba(255,255,255,0.07);
            border-radius: 50%;
            top: -50px;
            right: -30px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .header-left h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .header-left span {
            font-size: 0.75rem;
            opacity: 0.65;
        }

        .btn-back {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            position: relative;
            z-index: 1;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Toast */
        .toast {
            background: var(--green-bg);
            border: 1px solid var(--green);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #166534;
            animation: toast-in 0.3s ease-out;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section cards */
        .section {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .icon {
            font-size: 0.9rem;
        }

        /* Form */
        .field {
            margin-bottom: 16px;
        }

        .field:last-child { margin-bottom: 0; }

        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--surface-alt);
            color: var(--text);
            transition: all 0.2s;
            outline: none;
        }

        .field input:focus {
            border-color: var(--purple-light);
            background: #fff;
            box-shadow: 0 0 0 3px var(--purple-bg);
        }

        .field input::placeholder {
            color: var(--text-muted);
        }

        .field-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Time row */
        .time-row {
            display: flex;
            align-items: end;
            gap: 8px;
            margin-bottom: 16px;
        }

        .time-row:last-child { margin-bottom: 0; }

        .time-row .field {
            margin-bottom: 0;
        }

        .time-row .field.label-field {
            flex: 1;
        }

        .time-row .field.time-field {
            width: 70px;
        }

        .time-row .field.time-field input {
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .time-sep {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 10px;
        }

        .time-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            padding-bottom: 10px;
        }

        /* Submit */
        .submit-row {
            display: flex;
            justify-content: flex-end;
        }

        .btn-save {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 12px 32px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--purple);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(124, 92, 191, 0.3);
        }

        .btn-save:hover {
            background: #6a4dab;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 92, 191, 0.4);
        }

        @media (max-width: 560px) {
            body { padding: 16px 10px; }
            .section { padding: 18px 18px; }
            .time-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header-card">
            <div class="header-left">
                <div class="header-icon">&#9881;</div>
                <div>
                    <h1>Settings</h1>
                    <span>Configure your calendar</span>
                </div>
            </div>
            <a href="/" class="btn-back">&#8592; Calendar</a>
        </div>

        {% if saved %}
        <div class="toast">&#10003; Settings saved. Schedules reloaded.</div>
        {% endif %}

        <form method="POST" action="/settings">

            <div class="section" style="margin-bottom:20px">
                <div class="section-title"><span class="icon">&#127968;</span> Address</div>
                <div style="display:flex; gap:12px">
                    <div class="field" style="flex:1">
                        <label>Postcode</label>
                        <input type="text" name="postcode" value="{{ settings.get('postcode', '') }}" placeholder="5000AA">
                    </div>
                    <div class="field" style="width:120px">
                        <label>Huisnummer</label>
                        <input type="text" name="huisnummer" value="{{ settings.get('huisnummer', '') }}" placeholder="19">
                    </div>
                </div>
            </div>

            <div class="section" style="margin-bottom:20px">
                <div class="section-title"><span class="icon">&#9993;</span> Telegram</div>
                <div class="field">
                    <label>Bot Token</label>
                    <input type="text" name="telegram_bot_token" value="{{ settings.get('telegram_bot_token', '') }}" placeholder="123456:ABC-DEF...">
                    <div class="field-hint">Get from @BotFather on Telegram</div>
                </div>
                <div class="field">
                    <label>Chat ID</label>
                    <input type="text" name="telegram_chat_id" value="{{ settings.get('telegram_chat_id', '') }}" placeholder="-100123456789">
                    <div class="field-hint">Group chat ID (negative number)</div>
                </div>
            </div>

            <div class="section" style="margin-bottom:20px">
                <div class="section-title"><span class="icon">&#128339;</span> Schedules <span style="font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-muted)">&mdash; Europe/Amsterdam</span></div>

                <div class="time-row">
                    <div class="field label-field">
                        <div class="time-label">&#8635; Daily scrape</div>
                    </div>
                    <div class="field time-field">
                        <label>Hour</label>
                        <input type="number" name="scrape_hour" min="0" max="23" value="{{ settings.get('scrape_hour', '6') }}">
                    </div>
                    <div class="time-sep">:</div>
                    <div class="field time-field">
                        <label>Min</label>
                        <input type="number" name="scrape_minute" min="0" max="59" value="{{ settings.get('scrape_minute', '0') }}">
                    </div>
                </div>

                <div class="time-row">
                    <div class="field label-field">
                        <div class="time-label">&#127769; Evening reminder</div>
                    </div>
                    <div class="field time-field">
                        <label>Hour</label>
                        <input type="number" name="evening_hour" min="0" max="23" value="{{ settings.get('evening_hour', '20') }}">
                    </div>
                    <div class="time-sep">:</div>
                    <div class="field time-field">
                        <label>Min</label>
                        <input type="number" name="evening_minute" min="0" max="59" value="{{ settings.get('evening_minute', '0') }}">
                    </div>
                </div>

                <div class="time-row">
                    <div class="field label-field">
                        <div class="time-label">&#9728;&#65039; Morning reminder</div>
                    </div>
                    <div class="field time-field">
                        <label>Hour</label>
                        <input type="number" name="morning_hour" min="0" max="23" value="{{ settings.get('morning_hour', '7') }}">
                    </div>
                    <div class="time-sep">:</div>
                    <div class="field time-field">
                        <label>Min</label>
                        <input type="number" name="morning_minute" min="0" max="59" value="{{ settings.get('morning_minute', '0') }}">
                    </div>
                </div>
            </div>

            <div class="submit-row">
                <button type="submit" class="btn-save">Save Settings</button>
            </div>

        </form>

    </div>
</body>
</html>
